[build]
  command = "npm run build:static"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The Content-Security-Policy is generated into dist/_headers by
# scripts/build-static.js so it can include the exact Supabase origin.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
